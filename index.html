<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd3ff">
<title>Roadster Jump</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3ff;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;z-index:2}
#top{top:env(safe-area-inset-top,0);left:0;right:0;display:flex;gap:6px;padding:8px;flex-wrap:wrap;pointer-events:none}
button{pointer-events:auto;font:600 14px system-ui,sans-serif;border:1px solid rgba(255,255,255,.35);border-radius:12px;background:rgba(20,24,30,.55);color:#fff;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button:active{transform:scale(.96)}
#sens{pointer-events:auto;display:flex;align-items:center;gap:4px;font:700 13px system-ui;background:rgba(20,24,30,.55);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:3px 10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#sens input{width:90px}
#bRestart{top:calc(8px + env(safe-area-inset-top,0));right:8px;width:44px;height:44px;padding:0;font-size:22px}
#top{padding-right:60px!important}
#msg{top:58px;left:8px;right:8px;text-align:center;font:700 13px system-ui;color:#fff;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#thr{bottom:calc(16px + env(safe-area-inset-bottom,0));left:0;right:0;display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#thr button{width:86px;height:86px;font-size:14px;border-radius:50%;background:rgba(30,60,120,.5)}
#ov{inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
#card{background:rgba(250,250,252,.92);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:16px 20px;max-width:340px;width:84%;text-align:center}
#card h1{margin:0 0 6px;font:800 26px system-ui}
#card button{background:#1d2530;margin:3px}
#card table{width:100%;font:600 15px system-ui;margin:6px 0 12px}
#card td:last-child{text-align:right}
</style></head><body>
<canvas id="c"></canvas>
<div id="top" class="ui">
 <button id="bMotion">Enable Motion</button>
 <button id="bCal">Calibrate</button>
 <label id="sens">Motion Sensitivity <input id="sSens" type="range" min="0.2" max="1.5" step="0.05"><span id="sVal"></span></label>
</div>
<button id="bRestart" class="ui" title="Restart level (R)" aria-label="Restart level">↻</button>
<div id="msg" class="ui"></div>
<div id="thr" class="ui"><button id="bUp">▲ NOSE UP</button><button id="bDn">▼ NOSE DN</button></div>
<div id="ov" class="ui"><div id="card"><h1 id="rT"></h1><table id="rTab"></table><button id="bNext"></button> <button id="bRetry2">↻ Restart level</button></div></div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search),DEMO=Q.get('demo');
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// ---------- constants ----------
const G=900, DEG=Math.PI/180, LAUNCH_ANG=24*DEG, RAMP_LEN=320, RUNWAY=1500;
const DEAD=12, FULL=55, ALPHA=0.15;
const FLEET=[
 {n:'Model 3',c:'#2f6fd6',L:92,H:52,k:'m3'},
 {n:'Model Y',c:'#4a4f57',L:96,H:62,k:'my'},
 {n:'Tesla Semi',c:'#f2f2f2',L:118,H:112,k:'semi'},
 {n:'Cybertruck',c:'#b9c0c7',L:106,H:70,k:'cyber'},
 {n:'Cybercab',c:'#e8dcc0',L:84,H:54,k:'cab'}];
// ---------- state ----------
let W=0,H=0,DPR=1,S=1;
let level=+LS.get('rj_level',1)||1, best=+LS.get('rj_best',0)||0;
let sens=+LS.get('rj_sens',0.6); if(!(sens>0))sens=0.6;
let L; // level layout
let tscale=1;
let car, state, hold=false, keyU=false,keyD=false,btnU=false,btnD=false;
let motion={on:false,got:false,raw:0,base:null,sm:0,tStart:0,denied:false};
let tiltIn=0, input=0, particles=[], shake=0, result=null, timeT=0, camX=0, camY=0, popMsg=null;
const LIFT_V=720, LINE=RUNWAY+RAMP_LEN;
function buildLevel(n){
  const count=5+(n-1)*2, cars=[]; let x=LINE+160;
  for(let i=0;i<count;i++){const f=FLEET[i%FLEET.length];cars.push({...f,x});x+=f.L+30;}
  const lastEnd=x-30, landStart=lastEnd+60, landLen=600, landH=0, rampH=0;
  const tFly=2*LIFT_V/G; // flight time from vertical burst
  const REL=1500, vNeed=(lastEnd+110-REL)/tFly; const vMax=vNeed*1.25;
  return {n,cars,lastEnd,landStart,landH,landLen,rampH,vNeed,vMax,accel:vNeed*vNeed/(2*(REL-60)),end:landStart+landLen+2500};
}
function surf(x){return [0,0];}
function reset(){
  L=buildLevel(level);
  car={x:60,y:0,vx:0,vy:0,a:0,w:0,v:0,air:false,minClear:1e9,launchX:0,flame:0,crashed:false};
  state='runway'; result=null; particles=[]; hold=false; $('ov').style.display='none'; popMsg=null;
  setMsg();
}
// ---------- input ----------
function down(e){ if(e.target!==cv)return; e.preventDefault(); hold=true; if(state==='ready')state='runway'; }
function up(e){ if(!hold)return; hold=false; if(state==='runway'&&car.v>120){ car.released=true; takeoff(); } }
function takeoff(){
  car.vx=car.v; car.vy=LIFT_V; car.w=0.25; car.a=0; car.y=0; car.air=true; car.airT=0; state='air'; car.launchX=car.x; car.burst=1; hold=false; setMsg('');
  burst(car.x,4,34,['#e9d8b4','#cdb98f','#fff','#a89770'],420);
  if(car.v<L.vNeed*0.92)popMsg={t:'Too slow!',life:1.4}; else popMsg={t:'LIFT OFF!',life:1};
}
cv.addEventListener('pointerdown',down); addEventListener('pointerup',up); addEventListener('pointercancel',up);
cv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{ if(e.code==='Space'){if(!hold){hold=true;}e.preventDefault();}
  if(e.code==='ArrowUp'||e.code==='ArrowLeft'){keyU=true;e.preventDefault();} if(e.code==='ArrowDown'||e.code==='ArrowRight'){keyD=true;e.preventDefault();}
  if(e.code==='Enter'&&result)$('bNext').click(); if(e.code==='KeyR'){restartLevel();} });
addEventListener('keyup',e=>{ if(e.code==='Space')up(e); if(e.code==='ArrowUp'||e.code==='ArrowLeft')keyU=false; if(e.code==='ArrowDown'||e.code==='ArrowRight')keyD=false; });
function hb(el,set){const on=e=>{e.preventDefault();e.stopPropagation();set(true)},off=e=>{set(false)};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);}
hb($('bUp'),v=>btnU=v); hb($('bDn'),v=>btnD=v);
// motion
function orientAxis(e){ // returns degrees, + = nose up (tilt phone top/right side toward you... see README)
  const ang=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0);
  const b=e.beta||0,g=e.gamma||0;
  if(ang===90)return -b; if(ang===-90||ang===270)return b;
  return -g; // portrait: tilt left = nose up
}
function onOri(e){ if(e.beta==null&&e.gamma==null)return; motion.got=true; motion.raw=orientAxis(e);
  if(motion.base==null)motion.base=motion.raw; setFallback(); }
async function enableMotion(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted'){motion.denied=true;setMsg();setFallback();return;}
    }
  }catch(err){motion.denied=true;setMsg();setFallback();return;}
  if(!motion.on){addEventListener('deviceorientation',onOri);}
  motion.on=true; motion.tStart=performance.now(); motion.base=null; LS.set('rj_motion','1');
  setTimeout(()=>{ if(!motion.got){setMsg('No motion data received — using on-screen thrusters / arrow keys. (Brave blocks motion sensors: allow them in Site settings, or use Chrome.)');setFallback();} },1500);
  setMsg(); setFallback();
}
$('bMotion').addEventListener('click',enableMotion);
$('bCal').addEventListener('click',()=>{ if(motion.got){motion.base=motion.raw;motion.sm=0;setMsg('Calibrated: current tilt = level');setTimeout(()=>setMsg(),1500);} else setMsg('Enable Motion first'); });
$('sSens').value=sens; $('sVal').textContent=(+sens).toFixed(2);
$('sSens').addEventListener('input',e=>{sens=+e.target.value;$('sVal').textContent=sens.toFixed(2);LS.set('rj_sens',sens);});
function usingMotion(){return motion.on&&motion.got;}
function setFallback(){ $('thr').style.display=usingMotion()?'none':'flex'; $('bMotion').textContent=usingMotion()?'Motion ✓':'Enable Motion'; }
function setMsg(t){ if(t!=null){$('msg').textContent=t;return;}
  if(motion.denied){$('msg').textContent='Motion permission denied — using on-screen thrusters. Note: Brave blocks motion sensors (allow in Site settings or use Chrome).';return;}
  $('msg').textContent= state==='runway'?'Level '+level+' · '+L.cars.length+' cars · HOLD to accelerate, RELEASE to thrust straight up. Tilt or ▲▼ to pitch in the air (slow-mo).':''; }
// ---------- tilt mapping ----------
function tiltValue(){
  if(!usingMotion())return 0;
  let d=motion.raw-(motion.base||0); if(d>180)d-=360; if(d<-180)d+=360;
  motion.sm+= (d-motion.sm)*ALPHA;
  const a=Math.abs(motion.sm); if(a<DEAD)return 0;
  const t=Math.min(1,(a-DEAD)/(FULL-DEAD));
  return Math.sign(motion.sm)*Math.min(1,t*t*(0.5+0.5*t)*sens/0.6*0.85+0); // gentle curve
}
// ---------- physics ----------
function step(dt){
  timeT+=dt;
  if(window.__freeze){input=0.8;car.flame=0.8;return;}
  tiltIn=tiltValue();
  const manual=(keyU||btnU?1:0)-(keyD||btnD?1:0);
  input= manual!==0?manual:tiltIn;
  if(DEMO==='air'&&state==='air')input=0;
  if(state==='runway'){
    if(hold){car.v=Math.min(L.vMax,car.v+L.accel*dt);} else car.v=Math.max(0,car.v-80*dt);
    car.a=0; car.y=0; car.x+=car.v*dt;
    if(car.x>=LINE&&car.v>120){takeoff();}
    else if(car.x>=LINE){car.v=0;popMsg={t:'Too slow — hold!',life:1};car.x=LINE-1;}
  } else if(state==='air'){
    car.w+=input*3.2*dt; car.w*=Math.pow(0.55,dt); // thrusters + mild damping
    car.a+=car.w*dt; car.flame+= (Math.abs(input)-car.flame)*0.3;
    car.burst=Math.max(0,(car.burst||0)-dt*2.2);
    car.vy-=G*dt; car.vy+=Math.abs(input)*140*dt; car.vx+=(-input)*40*dt; car.x+=car.vx*dt; car.y+=car.vy*dt;
    // clearance & collisions
    for(const v of L.cars){
      if(car.x+40>v.x&&car.x-40<v.x+v.L){ const c=lowY()-v.H; car.minClear=Math.min(car.minClear,c); if(c<0){return crash('Hit the '+v.n+'!');} }
    }
    car.airT+=dt; if(car.airT>0.2&&car.vy<0)for(const p of wheelPts()){ const [h]=surf(p.x); if(p.y<=h){ return land(); } }
  } else if(state==='roll'||state==='crash'){
    const [h,s]=surf(car.x);
    if(state==='roll'){car.v=Math.max(0,car.v-500*dt);car.x+=car.v*dt;car.y=surf(car.x)[0];car.a+=(s-car.a)*0.2;}
    else {car.vy-=G*dt;car.x+=car.vx*dt;car.y+=car.vy*dt;car.a+=car.w*dt;
      const gy=Math.max(h,carGroundUnder());
      if(car.y<gy){car.y=gy;car.vy=Math.abs(car.vy)*0.35;car.vx*=0.6;car.w*=0.6;if(Math.abs(car.vy)<40)car.vy=0;}
      car.vx*=Math.pow(0.6,dt);}
    if(result&&!car.shown&&timeT>car.endT){car.shown=true;showResult();}
  }
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=(p.g||0)*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
  if(popMsg){popMsg.life-=dt;if(popMsg.life<=0)popMsg=null;}
  shake*=Math.pow(0.02,dt);
}
function carGroundUnder(){for(const v of L.cars)if(car.x>v.x&&car.x<v.x+v.L)return v.H;return 0;}
function wheelPts(){const c=Math.cos(car.a),s=Math.sin(car.a);return [-44,46].map(dx=>({x:car.x+dx*c,y:car.y+dx*s}));}
function lowY(){return Math.min(...wheelPts().map(p=>p.y),car.y);}
function burst(x,y,n,cols,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=spd*(0.3+Math.random());particles.push({x,y,vx:Math.cos(a)*v,vy:Math.abs(Math.sin(a))*v,g:700,life:0.6+Math.random()*0.6,c:cols[i%cols.length],r:4+Math.random()*7});}}
function crash(why){
  state='crash'; car.crashed=true; car.why=why; shake=1; car.w=(Math.random()<.5?-1:1)*6; car.vy=Math.max(car.vy,200); car.vx*=0.5;
  burst(car.x,car.y+20,40,['#ffb050','#4a4a4a','#888','#ff7a3d'],500); car.endT=timeT+1.6; scoreIt('crash');
}
function land(){
  const [h,s]=surf(car.x); let diff=(car.a-s)/DEG; diff=((diff+180)%360+360)%360-180;
  car.y=h;
  if(car.x<L.lastEnd)return crash('Landed short — on the fleet!');
  if(Math.abs(diff)>32)return crash('Landed at '+Math.abs(diff).toFixed(0)+'° — not wheels-down level!');
  car.landDiff=Math.abs(diff); car.v=Math.hypot(car.vx,car.vy)*0.7; state='roll';
  const perfect=car.landDiff<=8;
  car.grade=perfect?'perfect':'rough'; shake=perfect?0.25:0.6;
  burst(car.x,car.y,perfect?18:30,['#fff','#ddd','#aaa'],perfect?220:380);
  car.endT=timeT+1.3; scoreIt(car.grade);
}
function scoreIt(g){
  const dist=Math.max(0,(car.x-car.launchX)/10), clear=car.minClear<1e8?Math.max(0,car.minClear/10):0;
  const angPts=g==='crash'?0:Math.round(Math.max(0,32-(car.landDiff||32))/32*500);
  const total=g==='crash'?Math.round(dist*2):Math.round(dist*10+Math.min(clear,30)*10+angPts+(g==='perfect'?500:0)+L.cars.length*50);
  const nb=total>best; if(nb){best=total;LS.set('rj_best',best);}
  result={g,dist,clear,ang:car.landDiff,total,nb,why:car.why,cars:L.cars.length};
  window.__result=result;
}
function showResult(){
  const r=result; if(!r)return;
  const T={perfect:['Perfect landing!','#1f9d3a'],rough:['Rough landing','#d97a00'],crash:['Crash!','#d8262e']}[r.g];
  $('rT').textContent=T[0]; $('rT').style.color=T[1];
  $('rTab').innerHTML=
   `<tr><td>Level</td><td>${level} (${r.cars} cars)</td></tr><tr><td>Distance</td><td>${r.dist.toFixed(1)} m</td></tr>`+
   `<tr><td>Min clearance</td><td>${r.clear.toFixed(1)} m</td></tr><tr><td>Landing angle</td><td>${r.g==='crash'&&r.ang==null?'—':(r.ang||0).toFixed(1)+'°'}</td></tr>`+
   (r.why?`<tr><td colspan=2 style="text-align:center;color:#d8262e">${r.why}</td></tr>`:'')+
   `<tr><td><b>Score</b></td><td><b>${r.total}</b>${r.nb?' 🏆':''}</td></tr><tr><td>Best</td><td>${best}</td></tr>`;
  $('bNext').textContent=r.g==='crash'?'Retry level '+level:'Next level → '+(level+1);
  $('ov').style.display='flex';
}
function restartLevel(){reset();tscale=1;acc=0;}
$('bRestart').addEventListener('click',e=>{e.stopPropagation();restartLevel();});$('bRestart').addEventListener('pointerdown',e=>e.stopPropagation());
$('bRetry2').addEventListener('click',restartLevel);
$('bNext').addEventListener('click',()=>{ if(result&&result.g!=='crash'){level++;LS.set('rj_level',level);} reset(); });
// ---------- render ----------
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  S=Math.min(W/900,H/460); if(H>W)S=Math.min(W/470,H/520); S=Math.max(S,0.35);}
addEventListener('resize',()=>{resize();BG=null;});
const OL='#111';
function poly(pts,fill,lw){cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.closePath();cx.fillStyle=fill;cx.fill();if(lw!==0){cx.lineWidth=lw||3;cx.strokeStyle=OL;cx.stroke();}}
function circ(x,y,r,fill,lw){cx.beginPath();cx.arc(x,y,r,0,7);cx.fillStyle=fill;cx.fill();cx.lineWidth=lw||3;cx.strokeStyle=OL;cx.stroke();}
function rgb(c){const n=parseInt(c.slice(1),16);return [n>>16,n>>8&255,n&255];}
function shade(c,k){let [r,g,b]=rgb(c);const f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));return'rgb('+f(r)+','+f(g)+','+f(b)+')';}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);return c;}
// smooth closed path through points (quadratic through midpoints)
function smooth(g,pts,round){g.beginPath();const n=pts.length;const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  if(!round){pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();return;}
  let m=mid(pts[n-1],pts[0]);g.moveTo(m[0],m[1]);for(let i=0;i<n;i++){const p=pts[i],q=mid(p,pts[(i+1)%n]);g.quadraticCurveTo(p[0],p[1],q[0],q[1]);}g.closePath();}
// ---- cached sprites ----
const SPR={}; const RS=3; // render scale for cached art
function glowSprite(col,key){key=key||col;if(SPR['g'+key])return SPR['g'+key];const c=mk(64,64),g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);
  const [r,gg,b]=rgb(col);gr.addColorStop(0,`rgba(${r},${gg},${b},1)`);gr.addColorStop(0.35,`rgba(${r},${gg},${b},.45)`);gr.addColorStop(1,`rgba(${r},${gg},${b},0)`);g.fillStyle=gr;g.fillRect(0,0,64,64);return SPR['g'+key]=c;}
function noiseTile(w,h,base,amp,streak){const c=mk(w,h),g=c.getContext('2d');const id=g.createImageData(w,h);const [r,gg,b]=rgb(base);
  for(let i=0;i<w*h;i++){const n=(Math.random()-.5)*amp+(Math.random()<0.02?amp*0.8:0);const k=i*4;id.data[k]=r+n;id.data[k+1]=gg+n;id.data[k+2]=b+n;id.data[k+3]=255;}g.putImageData(id,0,0);
  if(streak){g.globalAlpha=0.06;for(let i=0;i<30;i++){g.fillStyle=Math.random()<.5?'#000':'#fff';g.fillRect(Math.random()*w,Math.random()*h,20+Math.random()*60,1);}}return c;}
let PAT=null;
function patterns(){if(PAT)return PAT;PAT={asphalt:cx.createPattern(noiseTile(256,64,'#3d3f43',26,true),'repeat'),grass:cx.createPattern(noiseTile(128,128,'#4f7a35',34),'repeat'),dirt:cx.createPattern(noiseTile(128,64,'#6b5b45',30),'repeat')};return PAT;}
// ----- front-view vehicles (cached) -----
function vehShape(k,w,h){const m=w/2;
  if(k==='m3')return{r:1,body:[[3,-8],[0,-24],[5,-31],[17,-34],[25,-h],[w-25,-h],[w-17,-34],[w-5,-31],[w,-24],[w-3,-8]],glass:[[19,-34],[27,-h+3],[w-27,-h+3],[w-19,-34]]};
  if(k==='my')return{r:1,body:[[3,-8],[0,-29],[5,-36],[16,-39],[23,-h],[w-23,-h],[w-16,-39],[w-5,-36],[w,-29],[w-3,-8]],glass:[[18,-39],[25,-h+4],[w-25,-h+4],[w-18,-39]]};
  if(k==='semi')return{r:1,body:[[3,-12],[2,-40],[7,-50],[10,-h+8],[18,-h],[w-18,-h],[w-10,-h+8],[w-7,-50],[w-2,-40],[w-3,-12]],glass:[[15,-62],[18,-h+12],[w-18,-h+12],[w-15,-62]]};
  if(k==='cyber')return{r:0,body:[[3,-10],[0,-37],[8,-44],[m,-h],[w-8,-44],[w,-37],[w-3,-10]],glass:[[15,-46],[m,-h+6],[w-15,-46]]};
  return{r:1,body:[[7,-8],[2,-24],[6,-34],[15,-h+4],[m,-h],[w-15,-h+4],[w-6,-34],[w-2,-24],[w-7,-8]],glass:[[13,-34],[19,-h+7],[w-19,-h+7],[w-13,-34]]};}
function vehSprite(v){const key='v'+v.k;if(SPR[key])return SPR[key];
  const w=v.L,h=v.H,PAD=24,c=mk((w+PAD*2)*RS,(h+PAD*2)*RS),g=c.getContext('2d');g.scale(RS,RS);g.translate(PAD,h+PAD-6);
  const {r,body,glass}=vehShape(v.k,w,h),m=w/2,k=v.k,col=v.c;

    for(let i=0;i<n;i++){const yy=-car.y-50+(i*37%110),xx=car.x-80-((timeT*sp*1.5+i*137)%300);cx.beginPath();cx.moveTo(xx,yy);cx.lineTo(xx-80-sp*0.06,yy);cx.stroke();}}
  heatSpots.length=0;
  drawRoadster();
  for(const [hx,hy,len] of heatSpots.slice(0,4)){cx.save();cx.globalAlpha=0.07;cx.strokeStyle='#fff';cx.lineWidth=1.2;for(let i=0;i<4;i++){const yy=-hy+(i-1.5)*len*0.2;cx.beginPath();for(let x=-len*0.4;x<=len*0.4;x+=4){const Y=yy+Math.sin(timeT*25+x*0.25+i)*2;x===-len*0.4?cx.moveTo(hx+x,Y):cx.lineTo(hx+x,Y);}cx.stroke();}cx.restore();}
  // particles: smoke/dust soft sprites, debris small
  for(const p of particles){const a=Math.max(0,Math.min(1,p.life/(p.max||1.2)));
    if(p.smoke||p.r>5){const r=p.r*(1+(1-a)*3);cx.globalAlpha=a*0.8;cx.drawImage(tinted(p.c),p.x-r,-p.y-r,r*2,r*2);}
    else{cx.globalAlpha=a;cx.fillStyle=p.c;cx.fillRect(p.x-1.5,-p.y-1.5,3,3);}}
  cx.globalAlpha=1;
  if(state==='crash'&&car.crashed){const t=timeT-(car.endT-1.6);if(t<1){cx.save();cx.globalCompositeOperation='lighter';cx.globalAlpha=Math.max(0,1-t);const r=60+t*200;cx.drawImage(glowSprite('#ffc070'),car.x-r,-car.y-r,r*2,r*2);cx.restore();}}
  cx.restore();
  // sun bloom / lens + filmic vignette
  cx.globalCompositeOperation='lighter';cx.globalAlpha=0.25;const sr=Math.min(W,H)*0.35;cx.drawImage(glowSprite('#fff2d8'),W*0.8-sr,H*0.16-sr,sr*2,sr*2);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+(0.28+(tscale<0.8?0.35*(1-tscale)/0.65:0))+')');cx.fillStyle=vg;cx.fillRect(0,0,W,H);
  if(tscale<0.8){cx.fillStyle='rgba(30,50,90,'+(0.12*(1-tscale))+')';cx.fillRect(0,0,W,H);txt('SLOW-MO',W-12,(H>W?150:128),18,'#dfe8ff','right');}
  // HUD
  hud();
}
function txt2(t,x,y){cx.font='600 12px system-ui';cx.textAlign='center';cx.fillStyle='rgba(255,255,255,.8)';cx.fillText(t,x,y);}
function txt(t,x,y,size,col,al){cx.font='800 '+size+'px system-ui';cx.textAlign=al||'left';cx.save();cx.shadowColor='rgba(0,0,0,.6)';cx.shadowBlur=6;cx.shadowOffsetY=2;cx.fillStyle=col||'#fff';cx.fillText(t,x,y);cx.restore();}
function hud(){
  const m=Math.min(W,H), R=Math.max(44,Math.min(70,m*0.13));
  const X=W-R-14, Y=H-R-18-(H>W?110:0);
  // speedometer
  const sp=state==='air'?Math.hypot(car.vx,car.vy):car.v, mph=sp*0.14, maxM=L.vMax*0.14*1.1;
  {const dg=cx.createRadialGradient(X,Y-R*0.3,R*0.1,X,Y,R);dg.addColorStop(0,'#2a2f36');dg.addColorStop(1,'#0b0d10');cx.beginPath();cx.arc(X,Y,R,0,7);cx.fillStyle=dg;cx.fill();cx.lineWidth=3;cx.strokeStyle='#8a929c';cx.stroke();}
  const a0=Math.PI*0.75,a1=Math.PI*2.25;
  cx.lineWidth=R*0.16;cx.strokeStyle='rgba(255,255,255,.15)';cx.beginPath();cx.arc(X,Y,R*0.78,a0,a1);cx.stroke();
  const need=L.vNeed*0.14/maxM; cx.strokeStyle='#5bbf4c';cx.beginPath();cx.arc(X,Y,R*0.78,a0+(a1-a0)*need,a1);cx.stroke();
  const f=Math.min(1,mph/maxM),aa=a0+(a1-a0)*f;
  cx.strokeStyle='#ff3b30';cx.lineWidth=3;cx.beginPath();cx.moveTo(X,Y);cx.lineTo(X+Math.cos(aa)*R*0.8,Y+Math.sin(aa)*R*0.8);cx.stroke();
  cx.fillStyle='#ccc';cx.beginPath();cx.arc(X,Y,4,0,7);cx.fill();
  cx.font='800 '+(R*0.36|0)+'px system-ui';cx.textAlign='center';cx.fillStyle='#fff';cx.fillText(Math.round(mph),X,Y+R*0.5);
  cx.font='700 '+(R*0.18|0)+'px system-ui';cx.fillText('MPH',X,Y+R*0.72);
  // left info
  const bx=12,by=H-18-(H>W?110:0);
  txt('LV '+level+'  BEST '+best,bx,by,16,'#fff');
  if(state==='air'){
    const ang=car.a/DEG; txt('PITCH '+(ang>=0?'+':'')+ang.toFixed(0)+'°',12,(H>W?150:128),18,Math.abs(ang)<10?'#7CFC00':'#ffd23f');
    // tilt meter
    const tw=120,tx0=12,ty0=(H>W?118:96);cx.fillStyle='rgba(0,0,0,.45)';cx.fillRect(tx0,ty0,tw,10);
    cx.fillStyle='#7fb2ff';const iv=input;cx.fillRect(tx0+tw/2,ty0,iv*tw/2,10);cx.fillStyle='#fff';cx.fillRect(tx0+tw/2-1,ty0-3,2,16);
    cx.font='700 11px system-ui';cx.textAlign='left';cx.fillStyle='#fff';cx.fillText(usingMotion()?'TILT':'THRUST',tx0+tw+6,ty0+10);
  }
  if(state==='runway'&&car.v<1&&car.x<100) txt('HOLD TO GO',W/2,H*0.42,Math.min(44,W/10),'#ffd23f','center');
  if(state==='runway'&&car.v>=L.vNeed&&hold) txt('RELEASE TO LIFT OFF!',W/2,H*0.42,Math.min(48,W/9),'#ff7a3d','center');
  if(popMsg)txt(popMsg.t,W/2,H*0.32,Math.min(40,W/10),'#fff','center');
  if(result&&!$('ov').style.display.includes('flex')){const T={perfect:'PERFECT LANDING!',rough:'ROUGH LANDING',crash:'CRASH!'}[result.g];txt(T,W/2,H*0.36,Math.min(46,W/11),result.g==='perfect'?'#7CFC00':result.g==='rough'?'#ffd23f':'#ff4040','center');}
}
// ---------- loop ----------
let last=performance.now(),acc=0;
function frame(now){ let dt=Math.min(0.05,(now-last)/1000); last=now;
  const want=(state==='air'&&!(car.vy<0&&car.y<45))?0.35:1; tscale+=(want-tscale)*Math.min(1,dt*(want<1?8:5)); acc+=dt*tscale; const h=1/120;
  while(acc>=h){step(h);acc-=h;} render(); requestAnimationFrame(frame); }
window.__game={restart:()=>restartLevel(),get car(){return car},get state(){return state},get level(){return level},get L(){return L},get input(){return input},get result(){return result},motion,setLevel(n){level=n;reset();},step,reset};
resize(); reset(); setFallback();
if(LS.get('rj_motion','0')==='1'&&typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission!=='function'){enableMotion();}
if(DEMO==='air'){ car.x=LINE-300; car.v=L.vMax; takeoff(); tscale=0.35;
  for(let i=0;i<70;i++)step(1/120); car.burst=0.6; camX=car.x+90; camY=car.y*0.5; window.__freeze=true; }
if(DEMO==='result'){ car.x=LINE-200; car.v=L.vNeed*1.05; takeoff(); for(let i=0;i<4000&&state!=='roll'&&state!=='crash';i++){ input=0; if(state==='air'){car.a*=0.95;car.w=0;} step(1/120);} 
  if(!result||result.g==='crash'){car.landDiff=3;scoreIt('perfect');} for(let i=0;i<200;i++)step(1/120); showResult(); camX=car.x; }
requestAnimationFrame(frame);
})();
